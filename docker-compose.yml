services:
  postgres:
    image: postgres:16-alpine
    container_name: kvp-orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kvp_orbit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - kvp_orbit_pgdata:/var/lib/postgresql/data

volumes:
  kvp_orbit_pgdata:

